<footer class="footer-wrapper py-5 position-relative border-top border-secondary border-opacity-25">
  <div class="container">
    <div class="row align-items-center gy-4">
      <div class="col-md-6 text-center text-md-start">
        <div class="d-flex align-items-center justify-content-center justify-content-md-start gap-2 mb-2">
          <span class="footer-logo">ARAF<span class="text-cyan">.</span></span>
          <span class="badge-tag">Full-Stack Engineer</span>
        </div>
        <p class="footer-tagline small mb-0">
          Crafted with <i class="bi bi-heart-fill text-danger mx-1"></i> using Angular, Bootstrap 5, & Custom SCSS.
        </p>
      </div>

      <div class="col-md-6 text-center text-md-end">
        <button
          type="button"
          class="btn btn-sm btn-back-to-top"
          (click)="scrollToTop()"
          aria-label="Back to top"
        >
          <span>Back to Top</span>
          <i class="bi bi-arrow-up ms-1"></i>
        </button>
        <div class="footer-copyright small mt-2">
          &copy; {{ currentYear }} Araf. All rights reserved.
        </div>
      </div>
    </div>
  </div>
</footer>
